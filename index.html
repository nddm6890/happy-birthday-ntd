<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday - Ôn Lại Kỷ Niệm ❤️</title>

    <style>
        /* ==========================================================================
           1. RESET & VARIABLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-cream: #FFFDF9;
            --pastel-pink: #FDE8E9;
            --blush-pink: #F8C8DC;
            --dusty-rose: #D8A7B1;
            --soft-rose: #B5838D;
            --burgundy: #6B2D38;
            --accent-warm: #E29578;
            --text-main: #4A3E3D;
            --shadow-soft: 0 10px 30px rgba(107, 45, 56, 0.08);
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.12);
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--pastel-pink);
            font-family: var(--font-sans);
            color: var(--text-main);
        }

        /* ==========================================================================
           2. FIXED UI & OVERLAYS
           ========================================================================== */
        .fixed-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .interactive-ui {
            pointer-events: auto;
        }

        /* Music Toggle Button */
        .audio-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(216, 167, 177, 0.4);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 120;
            transition: transform 0.2s, background 0.2s;
        }
        .audio-btn:hover { transform: scale(1.08); background: #FFF; }

        /* Reset Camera Button */
        .reset-cam-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(216, 167, 177, 0.4);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 120;
            transition: transform 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .reset-cam-btn.visible { opacity: 1; pointer-events: auto; }
        .reset-cam-btn:hover { transform: scale(1.08) rotate(90deg); }

        /* Letter Floating Button (Fixed Right) */
        .letter-trigger-wrapper {
            position: fixed;
            right: 25px;
            bottom: 30px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
        }
        .letter-trigger-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .letter-tooltip {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--burgundy);
            box-shadow: var(--shadow-soft);
            margin-bottom: 10px;
            border: 1px solid rgba(216, 167, 177, 0.3);
            animation: floatTooltip 3s ease-in-out infinite;
            white-space: nowrap;
        }

        .letter-btn {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFFDF9, #FDE8E9);
            border: 2px solid var(--dusty-rose);
            box-shadow: 0 8px 25px rgba(107, 45, 56, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .letter-btn:hover { transform: scale(1.1); }
        .letter-btn.shake-anim { animation: letterShake 4s ease-in-out infinite; }

        .letter-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--burgundy);
            color: white;
            font-size: 11px;
            font-weight: bold;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            animation: pulseBadge 1.5s infinite;
        }

        /* ==========================================================================
           3. SCREEN 1: PASSWORD LOCK SCREEN
           ========================================================================== */
        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #FFFDF9 0%, #FDE8E9 60%, #F8C8DC 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1), transform 0.8s;
        }
        .lock-screen.unlocked {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        .lock-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 35px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(107, 45, 56, 0.1);
            text-align: center;
            max-width: 340px;
            width: 90%;
        }

        .lock-title {
            font-family: var(--font-serif);
            font-size: 20px;
            color: var(--burgundy);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .lock-subtitle {
            font-size: 13px;
            color: var(--soft-rose);
            margin-bottom: 25px;
        }

        .dots-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--dusty-rose);
            transition: all 0.2s ease;
        }
        .dot.filled {
            background: var(--burgundy);
            border-color: var(--burgundy);
            transform: scale(1.15);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .key-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--burgundy);
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key-btn:active {
            transform: scale(0.92);
            background: var(--pastel-pink);
        }

        .lock-msg {
            height: 20px;
            font-size: 13px;
            margin-top: 15px;
            color: #d9534f;
            font-weight: 500;
        }

        /* Shake animation for wrong password */
        .shake {
            animation: shakeKeypad 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* ==========================================================================
           4. SCREEN 2: MEMORY SPACE 2D CANVAS / WORLD
           ========================================================================== */
        .viewport {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            cursor: grab;
        }
        .viewport:active { cursor: grabbing; }

        .world-space {
            position: absolute;
            width: 3200px;
            height: 2400px;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* Multi-layered Pink Background Shapes */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .bg-base {
            background: radial-gradient(circle at 50% 50%, #FFFDF9 0%, #FDE8E9 40%, #F8C8DC 80%, #E8A5B8 100%);
        }

        .pink-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
        }
        .blob-1 { width: 800px; height: 800px; background: #F8C8DC; top: 200px; left: 300px; }
        .blob-2 { width: 1000px; height: 900px; background: #D8A7B1; top: 1100px; left: 1600px; }
        .blob-3 { width: 700px; height: 700px; background: #FFFDF9; top: 800px; left: 800px; }

        /* Polaroid Photos in Memory Space */
        .polaroid {
            position: absolute;
            width: 220px;
            background: #FFFDF9;
            padding: 12px 12px 18px 12px;
            border-radius: 4px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s;
            will-change: transform;
        }
        .polaroid:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 0 25px 50px rgba(107, 45, 56, 0.22);
            z-index: 50 !important;
        }
        .polaroid-img-wrapper {
            width: 100%;
            height: 200px;
            background: #F4E8E1;
            overflow: hidden;
            border-radius: 2px;
        }
        .polaroid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .polaroid-caption {
            margin-top: 12px;
            font-family: var(--font-serif);
            font-size: 13px;
            color: var(--text-main);
            text-align: center;
            font-weight: 500;
        }
        .polaroid-date {
            font-size: 11px;
            color: var(--soft-rose);
            text-align: center;
            margin-top: 4px;
        }

        /* Decorative Paper Cards / Tape */
        .tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 18px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        /* ==========================================================================
           5. MODALS & OVERLAYS (PHOTO EXPAND, LETTER, GIFT)
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 62, 61, 0.4);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Expanded Photo Modal */
        .photo-modal-card {
            background: #FFFDF9;
            padding: 18px 18px 25px 18px;
            border-radius: 8px;
            max-width: 90%;
            width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .modal-overlay.active .photo-modal-card {
            transform: scale(1);
        }
        .photo-modal-img {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 4px;
            background: #f0f0f0;
        }
        .photo-modal-title {
            font-family: var(--font-serif);
            font-size: 18px;
            color: var(--burgundy);
            margin-top: 15px;
            text-align: center;
        }
        .photo-modal-desc {
            font-size: 14px;
            color: var(--text-main);
            margin-top: 8px;
            text-align: center;
            line-height: 1.5;
        }
        .photo-modal-date {
            font-size: 12px;
            color: var(--soft-rose);
            text-align: center;
            margin-top: 6px;
        }
        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            font-size: 18px;
            color: var(--burgundy);
            border: none;
        }

        /* 3D Envelope Container & Letter Animation */
        .envelope-container {
            width: 320px;
            height: 220px;
            position: relative;
            perspective: 1000px;
            cursor: pointer;
        }
        .envelope {
            width: 100%;
            height: 100%;
            position: absolute;
            background: #F8C8DC;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(107, 45, 56, 0.2);
            border: 1px solid #E8A5B8;
        }
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #D8A7B1;
            transform-origin: top;
            transition: transform 0.6s ease, z-index 0.6s;
            z-index: 5;
        }
        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #FDE8E9;
            border-right: 160px solid #FDE8E9;
            border-bottom: 120px solid #F8C8DC;
            border-radius: 0 0 8px 8px;
            z-index: 4;
        }

        /* Letter Paper */
        .letter-paper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            background: #FFFDF9;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(107, 45, 56, 0.25);
            border: 1px solid rgba(216, 167, 177, 0.4);
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 350;
        }
        .letter-paper.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .letter-title {
            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--burgundy);
            margin-bottom: 20px;
        }
        .letter-body {
            font-family: var(--font-serif);
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-line;
        }
        .letter-signature {
            margin-top: 30px;
            text-align: right;
            font-family: var(--font-serif);
            font-size: 18px;
            color: var(--soft-rose);
            font-style: italic;
        }

        .open-gift-btn {
            margin: 30px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--dusty-rose), var(--burgundy));
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(107, 45, 56, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .open-gift-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 25px rgba(107, 45, 56, 0.35);
        }

        /* 3D Gift Box Modal */
        .gift-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 62, 61, 0.5);
            backdrop-filter: blur(10px);
            z-index: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .gift-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .gift-box {
            width: 140px;
            height: 140px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }
        .gift-box:hover { transform: scale(1.05); }
        .gift-box.shake-gift { animation: shakeKeypad 0.5s ease-in-out infinite; }

        .gift-body {
            width: 100%;
            height: 100%;
            background: var(--dusty-rose);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .gift-ribbon-v {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 100%;
            background: #FFFDF9;
        }
        .gift-ribbon-h {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 28px;
            background: #FFFDF9;
        }
        .gift-lid {
            position: absolute;
            top: -12px;
            left: -10px;
            width: 160px;
            height: 35px;
            background: var(--burgundy);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2;
        }
        .gift-box.open .gift-lid {
            transform: translateY(-120px) rotate(-20deg);
            opacity: 0;
        }

        .gift-hint {
            color: white;
            margin-top: 30px;
            font-size: 15px;
            font-family: var(--font-serif);
            letter-spacing: 1px;
            animation: pulseBadge 2s infinite;
        }

        /* Final Message Paper inside Gift */
        .final-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 500px;
            background: #FFFDF9;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.3);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 450;
        }
        .final-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .final-heart {
            font-size: 40px;
            color: var(--burgundy);
            margin-bottom: 10px;
            animation: pulseBadge 1.5s infinite;
        }
        .final-title {
            font-family: var(--font-serif);
            font-size: 26px;
            color: var(--burgundy);
            margin-bottom: 15px;
        }
        .final-body {
            font-family: var(--font-serif);
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-line;
            margin-bottom: 25px;
        }
        .restart-btn {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid var(--dusty-rose);
            color: var(--burgundy);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .restart-btn:hover {
            background: var(--pastel-pink);
        }

        /* Sparkles Canvas */
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 420;
        }

        /* ==========================================================================
           6. ANIMATIONS & MEDIA QUERIES
           ========================================================================== */
        @keyframes floatTooltip {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes letterShake {
            0%, 90%, 100% { transform: rotate(0deg); }
            92% { transform: rotate(-8deg); }
            94% { transform: rotate(8deg); }
            96% { transform: rotate(-5deg); }
            98% { transform: rotate(5deg); }
        }
        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes shakeKeypad {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media (max-width: 600px) {
            .lock-container { padding: 25px 20px; }
            .key-btn { font-size: 18px; }
            .polaroid { width: 170px; padding: 8px 8px 14px 8px; }
            .polaroid-img-wrapper { height: 150px; }
            .letter-paper { padding: 30px 20px; }
            .letter-title { font-size: 20px; }
            .letter-body { font-size: 14px; }
        }

        /* Reduced Motion Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- FIXED UI OVERLAYS -->
    <div class="fixed-ui">
        <button class="audio-btn interactive-ui" id="audioBtn" title="Bật/Tắt Nhạc">🔊</button>
        <button class="reset-cam-btn interactive-ui" id="resetCamBtn" title="Trở về vị trí ban đầu">⟳</button>

        <div class="letter-trigger-wrapper interactive-ui" id="letterWrapper">
            <div class="letter-tooltip" id="letterTooltip">Bạn có một lá thư 💌</div>
            <div class="letter-btn shake-anim" id="letterBtn">
                ✉️
                <div class="letter-badge" id="letterBadge">1</div>
            </div>
        </div>
    </div>

    <!-- 1. LOCK SCREEN -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-container" id="lockContainer">
            <div class="lock-title">Góc Kỷ Niệm</div>
            <div class="lock-subtitle">Một chút bí mật trước khi bắt đầu...</div>
            
            <div class="dots-display">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="keypad">
                <button class="key-btn" data-key="1">1</button>
                <button class="key-btn" data-key="2">2</button>
                <button class="key-btn" data-key="3">3</button>
                <button class="key-btn" data-key="4">4</button>
                <button class="key-btn" data-key="5">5</button>
                <button class="key-btn" data-key="6">6</button>
                <button class="key-btn" data-key="7">7</button>
                <button class="key-btn" data-key="8">8</button>
                <button class="key-btn" data-key="9">9</button>
                <button class="key-btn" data-key="back">←</button>
                <button class="key-btn" data-key="0">0</button>
                <button class="key-btn" data-key="ok">✓</button>
            </div>

            <div class="lock-msg" id="lockMsg"></div>
        </div>
    </div>

    <!-- 2. MEMORY SPACE (PAN / ZOOM WORLD) -->
    <div class="viewport" id="viewport">
        <div class="world-space" id="worldSpace">
            <!-- Background layers -->
            <div class="bg-layer bg-base"></div>
            <div class="bg-layer">
                <div class="pink-blob blob-1"></div>
                <div class="pink-blob blob-2"></div>
                <div class="pink-blob blob-3"></div>
            </div>

            <!-- Photos will be dynamically injected here -->
            <div id="photosContainer"></div>
        </div>
    </div>

    <!-- 3. EXPANDED PHOTO MODAL -->
    <div class="modal-overlay" id="photoModal">
        <div class="photo-modal-card">
            <button class="close-btn" id="closePhotoBtn">✕</button>
            <img src="" alt="Memory photo" class="photo-modal-img" id="modalImg">
            <div class="photo-modal-title" id="modalTitle"></div>
            <div class="photo-modal-desc" id="modalDesc"></div>
            <div class="photo-modal-date" id="modalDate"></div>
        </div>
    </div>

    <!-- 4. ENVELOPE / LETTER MODAL -->
    <div class="modal-overlay" id="envelopeModal">
        <div class="envelope-container" id="envelopeContainer">
            <div class="envelope" id="envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-pocket"></div>
            </div>
        </div>
    </div>

    <!-- LETTER CONTENT PAPER -->
    <div class="letter-paper" id="letterPaper">
        <div class="letter-title" id="letterTitle"></div>
        <div class="letter-body" id="letterBody"></div>
        <div class="letter-signature" id="letterSig"></div>
        <button class="open-gift-btn" id="openGiftTrigger">
            🎁 Mở Món Quà Bí Mật
        </button>
    </div>

    <!-- 5. GIFT BOX MODAL -->
    <div class="gift-modal" id="giftModal">
        <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>
            <div class="gift-body">
                <div class="gift-ribbon-v"></div>
                <div class="gift-ribbon-h"></div>
            </div>
        </div>
        <div class="gift-hint" id="giftHint">Chạm vào hộp quà để mở ✨</div>
    </div>

    <!-- FINAL CARD INSIDE GIFT -->
    <div class="final-card" id="finalCard">
        <div class="final-heart">❤️</div>
        <div class="final-title" id="finalTitle"></div>
        <div class="final-body" id="finalBody"></div>
        <button class="restart-btn" id="restartBtn">↺ Xem lại kỷ niệm</button>
    </div>

    <!-- Sparkles Effect Canvas -->
    <canvas id="sparkleCanvas"></canvas>

    <script>
        /* ==========================================================================
           CONFIGURATIONS (Dễ dàng tùy chỉnh tại đây)
           ========================================================================== */
        const PASSWORD = "1234";

        const MUSIC_URL = "birthday.mp3"; // Đường dẫn file nhạc của bạn

        const CAMERA_CONFIG = {
            minZoom: 0.4,
            maxZoom: 2.2,
            zoomSpeed: 0.0015
        };

        const MEMORIES = [
            {
                image: "https://picsum.photos/id/1018/600/600",
                title: "Chuyến Đi Đầu Tiên",
                date: "15/03/2024",
                description: "Ngọn núi hôm ấy thật đẹp, và nụ cười của cậu còn đẹp hơn thế.",
                x: 1000,
                y: 800,
                rotation: -5
            },
            {
                image: "https://picsum.photos/id/1025/600/600",
                title: "Chiều Cà Phê Trốn Mưa",
                date: "22/05/2024",
                description: "Góc quán nhỏ, hai tách trà nóng và những câu chuyện không hồi kết.",
                x: 1500,
                y: 700,
                rotation: 4
            },
            {
                image: "https://picsum.photos/id/1062/600/600",
                title: "Bình Minh Trên Biển",
                date: "10/08/2024",
                description: "Thức dậy từ 5h sáng chỉ để đón cái nắng đầu tiên cùng nhau.",
                x: 2000,
                y: 950,
                rotation: -3
            },
            {
                image: "https://picsum.photos/id/1069/600/600",
                title: "Buổi Tối Ấm Áp",
                date: "24/12/2024",
                description: "Giáng sinh năm ấy rực rỡ sắc màu và tràn ngập tiếng cười.",
                x: 1200,
                y: 1350,
                rotation: 6
            },
            {
                image: "https://picsum.photos/id/1084/600/600",
                title: "Một Ngày Bình Yên",
                date: "14/02/2025",
                description: "Không cần đi đâu xa, chỉ cần bên nhau là đủ trọn vẹn.",
                x: 1750,
                y: 1300,
                rotation: -4
            }
        ];

        const LETTER_DATA = {
            title: "Gửi cậu,",
            content: `Có những kỷ niệm tưởng như rất bình thường, nhưng sau này nhìn lại mới nhận ra đó lại là những điều mình nhớ nhất.\n\nCảm ơn cậu vì đã luôn đồng hành, cùng chia sẻ từng khoảnh khắc vui buồn và tô điểm cho cuộc sống của mình thêm nhiều màu sắc rực rỡ.\n\nChúc cậu một sinh nhật thật ấm áp, tràn ngập niềm vui và luôn giữ vững nụ cười trên môi nhé! ❤️`,
            signature: "Gửi từ một người luôn trân quý cậu"
        };

        const GIFT_DATA = {
            title: "Món Quà Cuối Cùng",
            content: `Nếu cậu đang đọc đến những dòng này...\n\nThì có lẽ cậu đã đi qua tất cả những kỷ niệm mà mình muốn gửi gắm.\n\nHy vọng tuổi mới sẽ mang đến cho cậu thật nhiều may mắn, bình an và đạt được mọi giấc mơ của mình.\n\nHAPPY BIRTHDAY! 🎉✨`
        };

        /* ==========================================================================
           AUDIO SYSTEM (Synthesized Fallback + Background Music)
           ========================================================================== */
        let bgAudio = new Audio();
        bgAudio.src = MUSIC_URL;
        bgAudio.loop = true;
        bgAudio.volume = 0.35;

        let isMuted = false;
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Web Audio Synth Fallback Sound Effects
        function playSynthSound(freq, type = 'sine', duration = 0.1) {
            try {
                initAudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const audioBtn = document.getElementById('audioBtn');
        function toggleAudio() {
            isMuted = !isMuted;
            bgAudio.muted = isMuted;
            audioBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        audioBtn.addEventListener('click', toggleAudio);

        function tryPlayMusic() {
            initAudioContext();
            bgAudio.play().catch(() => {
                // Browser blocked autoplay; will play on first interaction
            });
        }

        /* ==========================================================================
           1. PASSWORD SYSTEM
           ========================================================================== */
        let inputPass = "";
        const dots = document.querySelectorAll('.dot');
        const lockMsg = document.getElementById('lockMsg');
        const lockContainer = document.getElementById('lockContainer');
        const lockScreen = document.getElementById('lockScreen');

        function updateDots() {
            dots.forEach((dot, idx) => {
                if (idx < inputPass.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
        }

        function handleKeyInput(key) {
            playSynthSound(400, 'sine', 0.05);
            tryPlayMusic();

            if (key === 'back') {
                inputPass = inputPass.slice(0, -1);
            } else if (key === 'ok') {
                verifyPassword();
                return;
            } else if (inputPass.length < 4 && !isNaN(key)) {
                inputPass += key;
            }
            updateDots();
            if (inputPass.length === 4) {
                setTimeout(verifyPassword, 150);
            }
        }

        function verifyPassword() {
            if (inputPass === PASSWORD) {
                playSynthSound(600, 'sine', 0.2);
                lockScreen.classList.add('unlocked');
                document.getElementById('letterWrapper').classList.add('visible');
                document.getElementById('resetCamBtn').classList.add('visible');
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                }, 800);
            } else {
                playSynthSound(150, 'sawtooth', 0.25);
                lockContainer.classList.add('shake');
                lockMsg.textContent = "Sai rồi... thử lại nhé ❤️";
                inputPass = "";
                updateDots();
                setTimeout(() => {
                    lockContainer.classList.remove('shake');
                    lockMsg.textContent = "";
                }, 600);
            }
        }

        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => handleKeyInput(btn.dataset.key));
        });

        window.addEventListener('keydown', (e) => {
            if (lockScreen.style.display === 'none') return;
            if (e.key >= '0' && e.key <= '9') handleKeyInput(e.key);
            else if (e.key === 'Backspace') handleKeyInput('back');
            else if (e.key === 'Enter') handleKeyInput('ok');
        });

        /* ==========================================================================
           2. CAMERA / PAN / ZOOM SYSTEM (CURSOR ANCHORED)
           ========================================================================== */
        const viewport = document.getElementById('viewport');
        const worldSpace = document.getElementById('worldSpace');

        let camera = {
            x: -600,
            y: -300,
            zoom: 0.85,
            targetX: -600,
            targetY: -300,
            targetZoom: 0.85
        };

        let isDragging = false;
        let startX = 0, startY = 0;

        function updateTransform() {
            // Smooth Camera Interpolation (Easing)
            camera.x += (camera.targetX - camera.x) * 0.12;
            camera.y += (camera.targetY - camera.y) * 0.12;
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.12;

            worldSpace.style.transform = `translate3d(${camera.x}px, ${camera.y}px, 0px) scale(${camera.zoom})`;
            requestAnimationFrame(updateTransform);
        }
        requestAnimationFrame(updateTransform);

        // Zoom centered at Cursor Position
        function handleZoom(delta, cursorX, cursorY) {
            const oldZoom = camera.targetZoom;
            let newZoom = oldZoom * (1 - delta * CAMERA_CONFIG.zoomSpeed);
            newZoom = Math.min(Math.max(newZoom, CAMERA_CONFIG.minZoom), CAMERA_CONFIG.maxZoom);

            if (newZoom === oldZoom) return;

            // Anchor point calculation
            const worldCursorX = (cursorX - camera.targetX) / oldZoom;
            const worldCursorY = (cursorY - camera.targetY) / oldZoom;

            camera.targetX = cursorX - worldCursorX * newZoom;
            camera.targetY = cursorY - worldCursorY * newZoom;
            camera.targetZoom = newZoom;
        }

        // Mouse Wheel Event
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            handleZoom(e.deltaY, e.clientX, e.clientY);
        }, { passive: false });

        // Mouse Drag / Pan
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.polaroid')) return;
            isDragging = true;
            startX = e.clientX - camera.targetX;
            startY = e.clientY - camera.targetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            camera.targetX = e.clientX - startX;
            camera.targetY = e.clientY - startY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Mobile Touch Pan & Pinch-to-Zoom
        let touchStartDist = 0;
        let touchStartZoom = 1;

        viewport.addEventListener('touchstart', (e) => {
            if (e.target.closest('.polaroid')) return;
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - camera.targetX;
                startY = e.touches[0].clientY - camera.targetY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartZoom = camera.targetZoom;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                camera.targetX = e.touches[0].clientX - startX;
                camera.targetY = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / touchStartDist;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                let newZoom = touchStartZoom * factor;
                newZoom = Math.min(Math.max(newZoom, CAMERA_CONFIG.minZoom), CAMERA_CONFIG.maxZoom);

                const worldMidX = (midX - camera.targetX) / camera.targetZoom;
                const worldMidY = (midY - camera.targetY) / camera.targetZoom;

                camera.targetX = midX - worldMidX * newZoom;
                camera.targetY = midY - worldMidY * newZoom;
                camera.targetZoom = newZoom;
            }
        }, { passive: true });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        // Reset Camera Button
        document.getElementById('resetCamBtn').addEventListener('click', () => {
            playSynthSound(500, 'sine', 0.1);
            camera.targetX = -600;
            camera.targetY = -300;
            camera.targetZoom = 0.85;
        });

        /* ==========================================================================
           3. RENDER MEMORIES & PHOTO MODAL
           ========================================================================== */
        const photosContainer = document.getElementById('photosContainer');
        const photoModal = document.getElementById('photoModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalDate = document.getElementById('modalDate');

        MEMORIES.forEach((mem) => {
            const card = document.createElement('div');
            card.className = 'polaroid';
            card.style.left = `${mem.x}px`;
            card.style.top = `${mem.y}px`;
            card.style.transform = `rotate(${mem.rotation}deg)`;

            card.innerHTML = `
                <div class="tape"></div>
                <div class="polaroid-img-wrapper">
                    <img src="${mem.image}" alt="${mem.title}" class="polaroid-img" loading="lazy">
                </div>
                <div class="polaroid-caption">${mem.title}</div>
                <div class="polaroid-date">${mem.date}</div>
            `;

            card.addEventListener('click', () => {
                playSynthSound(450, 'sine', 0.1);
                modalImg.src = mem.image;
                modalTitle.textContent = mem.title;
                modalDesc.textContent = mem.description;
                modalDate.textContent = mem.date;
                photoModal.classList.add('active');
            });

            photosContainer.appendChild(card);
        });

        document.getElementById('closePhotoBtn').addEventListener('click', () => {
            playSynthSound(300, 'sine', 0.1);
            photoModal.classList.remove('active');
        });

        /* ==========================================================================
           4. LETTER & ENVELOPE SYSTEM
           ========================================================================== */
        const letterBtn = document.getElementById('letterBtn');
        const letterBadge = document.getElementById('letterBadge');
        const letterTooltip = document.getElementById('letterTooltip');
        const envelopeModal = document.getElementById('envelopeModal');
        const envelope = document.getElementById('envelope');
        const letterPaper = document.getElementById('letterPaper');

        // Hide tooltip after 5s
        setTimeout(() => {
            letterTooltip.style.opacity = '0';
            setTimeout(() => letterTooltip.remove(), 500);
        }, 5000);

        letterBtn.addEventListener('click', () => {
            playSynthSound(520, 'sine', 0.12);
            letterBadge.style.display = 'none';
            letterBtn.classList.remove('shake-anim');

            envelopeModal.classList.add('active');

            setTimeout(() => {
                envelope.classList.add('open');
                playSynthSound(350, 'triangle', 0.2);
            }, 400);

            setTimeout(() => {
                envelopeModal.classList.remove('active');
                openLetterPaper();
            }, 1400);
        });

        function openLetterPaper() {
            document.getElementById('letterTitle').textContent = LETTER_DATA.title;
            document.getElementById('letterBody').textContent = LETTER_DATA.content;
            document.getElementById('letterSig').textContent = LETTER_DATA.signature;
            letterPaper.classList.add('active');
        }

        /* ==========================================================================
           5. GIFT BOX & SPARKLES SYSTEM
           ========================================================================== */
        const openGiftTrigger = document.getElementById('openGiftTrigger');
        const giftModal = document.getElementById('giftModal');
        const giftBox = document.getElementById('giftBox');
        const finalCard = document.getElementById('finalCard');

        openGiftTrigger.addEventListener('click', () => {
            playSynthSound(580, 'sine', 0.15);
            letterPaper.classList.remove('active');
            giftModal.classList.add('active');
        });

        giftBox.addEventListener('click', () => {
            giftBox.classList.add('open');
            playSynthSound(700, 'triangle', 0.3);
            triggerSparkles();

            setTimeout(() => {
                giftModal.classList.remove('active');
                document.getElementById('finalTitle').textContent = GIFT_DATA.title;
                document.getElementById('finalBody').textContent = GIFT_DATA.content;
                finalCard.classList.add('active');
            }, 1000);
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            playSynthSound(400, 'sine', 0.1);
            finalCard.classList.remove('active');
            camera.targetX = -600;
            camera.targetY = -300;
            camera.targetZoom = 0.85;
        });

        /* Sparkles Canvas Animation */
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerSparkles() {
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 2,
                    color: `hsl(${Math.random() * 40 + 340}, 80%, 70%)`,
                    alpha: 1
                });
            }
            animateSparkles();
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let alive = false;

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // Gravity
                p.alpha -= 0.015;

                if (p.alpha > 0) {
                    alive = true;
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            if (alive) requestAnimationFrame(animateSparkles);
        }
    </script>
</body>
</html>
