        ================================ */
        memorySpace.addEventListener('mousedown', (e) => {
            if (e.target.closest('.memory-photo') || e.target.closest('#letter-notification') ||
                e.target.closest('.letter-tooltip') || e.target.closest('#reset-camera')) return;
            if (!isUnlocked) return;
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragCameraX = camera.targetX;
            dragCameraY = camera.targetY;
            memorySpace.classList.add('dragging');
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            camera.targetX = dragCameraX + dx;
            camera.targetY = dragCameraY + dy;
            clampCamera();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                memorySpace.classList.remove('dragging');
            }
        });

        /* ================================
           ZOOM — MOUSE WHEEL
        ================================ */
        memorySpace.addEventListener('wheel', (e) => {
            if (!isUnlocked) return;
            e.preventDefault();
            const vp = getViewportSize();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const worldX = (mouseX - camera.x) / camera.zoom;
            const worldY = (mouseY - camera.y) / camera.zoom;
            const delta = e.deltaY > 0 ? -1 : 1;
            const newZoom = Math.max(CAMERA_CONFIG.minZoom,
                Math.min(CAMERA_CONFIG.maxZoom,
                    camera.targetZoom * (1 + delta * CAMERA_CONFIG.zoomSpeed)));
            const newX = mouseX - worldX * newZoom;
            const newY = mouseY - worldY * newZoom;
            camera.targetZoom = newZoom;
            camera.targetX = newX;
            camera.targetY = newY;
            clampCamera();
        }, { passive: false });

        /* ================================
           TOUCH — PAN & PINCH ZOOM
        ================================ */
        let touches = [];

        memorySpace.addEventListener('touchstart', (e) => {
            if (!isUnlocked) return;
            if (e.target.closest('.memory-photo') || e.target.closest('#letter-notification') ||
                e.target.closest('#reset-camera')) return;
            touches = Array.from(e.touches);
            if (touches.length === 1) {
                isDragging = true;
                dragStartX = touches[0].clientX;
                dragStartY = touches[0].clientY;
                dragCameraX = camera.targetX;
                dragCameraY = camera.targetY;
                memorySpace.classList.add('dragging');
            } else if (touches.length === 2) {
                isDragging = false;
                memorySpace.classList.remove('dragging');
                lastPinchDist = Math.hypot(
                    touches[1].clientX - touches[0].clientX,
                    touches[1].clientY - touches[0].clientY
                );
                pinchStartZoom = camera.targetZoom;
                pinchStartCameraX = camera.targetX;
                pinchStartCameraY = camera.targetY;
                pinchMidX = (touches[0].clientX + touches[1].clientX) / 2;
                pinchMidY = (touches[0].clientY + touches[1].clientY) / 2;
            }
            e.preventDefault();
        }, { passive: false });

        memorySpace.addEventListener('touchmove', (e) => {
            if (!isUnlocked) return;
            e.preventDefault();
            touches = Array.from(e.touches);
            if (touches.length === 1 && isDragging) {
                const dx = touches[0].clientX - dragStartX;
                const dy = touches[0].clientY - dragStartY;
                camera.targetX = dragCameraX + dx;
                camera.targetY = dragCameraY + dy;
                clampCamera();
            } else if (touches.length === 2) {
                const dist = Math.hypot(
                    touches[1].clientX - touches[0].clientX,
                    touches[1].clientY - touches[0].clientY
                );
                const scale = dist / lastPinchDist;
                const newZoom = Math.max(CAMERA_CONFIG.minZoom,
                    Math.min(CAMERA_CONFIG.maxZoom, pinchStartZoom * scale));
                const midX = (touches[0].clientX + touches[1].clientX) / 2;
                const midY = (touches[0].clientY + touches[1].clientY) / 2;
                const worldX = (pinchMidX - pinchStartCameraX) / pinchStartZoom;
                const worldY = (pinchMidY - pinchStartCameraY) / pinchStartZoom;
                camera.targetZoom = newZoom;
                camera.targetX = midX - worldX * newZoom;
                camera.targetY = midY - worldY * newZoom;
                clampCamera();
            }
        }, { passive: false });

        memorySpace.addEventListener('touchend', (e) => {
            if (!isUnlocked) return;
            touches = Array.from(e.touches);
            if (touches.length === 0) {
                isDragging = false;
                memorySpace.classList.remove('dragging');
            } else if (touches.length === 1 && isDragging) {
                dragStartX = touches[0].clientX;
                dragStartY = touches[0].clientY;
                dragCameraX = camera.targetX;
                dragCameraY = camera.targetY;
            }
        });

        /* ================================
           MEMORIES / PHOTOS
        ================================ */
        function createMemoryPhotos() {
            MEMORIES.forEach((memory, index) => {
                const photoEl = document.createElement('div');
                photoEl.className = 'memory-photo';
                photoEl.style.left = memory.x + 'px';
                photoEl.style.top = memory.y + 'px';
                photoEl.style.width = (memory.width || 260) + 'px';
                photoEl.style.transform = `rotate(${memory.rotation}deg)`;
                photoEl.style.zIndex = 10 + index;
                photoEl.dataset.index = index;
                photoEl.setAttribute('role', 'button');
                photoEl.setAttribute('aria-label', `${memory.title} — ${memory.date}`);

                const inner = document.createElement('div');
                inner.className = 'memory-photo-inner';
                inner.style.transform = `rotate(${memory.rotation}deg)`;

                const img = document.createElement('img');
                img.src = memory.image;
                img.alt = memory.title;
                img.loading = 'lazy';
                img.draggable = false;
                img.addEventListener('error', () => {
                    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#e8ddd5"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" font-family="serif" font-size="20" fill="#a89090">📷 Kỷ niệm</text></svg>'
                    );
                });

                const caption = document.createElement('div');
                caption.className = 'memory-photo-caption';
                caption.textContent = memory.title;

                const date = document.createElement('div');
                date.className = 'memory-photo-date';
                date.textContent = memory.date;

                inner.appendChild(img);
                inner.appendChild(caption);
                inner.appendChild(date);
                photoEl.appendChild(inner);

                photoEl.addEventListener('click', () => {
                    openLightbox(memory);
                });

                photoEl.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    openLightbox(memory);
                });

                photosContainer.appendChild(photoEl);
            });
        }

        function openLightbox(memory) {
            lightboxImg.src = memory.image;
            lightboxImg.onerror = () => {
                lightboxImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#e8ddd5"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" font-family="serif" font-size="20" fill="#a89090">📷</text></svg>'
                );
            };
            lightboxTitle.textContent = memory.title;
            lightboxDesc.textContent = memory.description || '';
            lightboxDate.textContent = memory.date || '';
            photoLightbox.classList.add('active');
            playPaperSound();
        }

        function closeLightbox() {
            photoLightbox.classList.remove('active');
        }

        lightboxClose.addEventListener('click', closeLightbox);
        photoLightbox.addEventListener('click', (e) => {
            if (e.target === photoLightbox) closeLightbox();
        });

        /* ================================
           LETTER NOTIFICATION
        ================================ */
        function showLetterTooltip() {
            letterTooltip.classList.add('show');
            if (tooltipTimeout) clearTimeout(tooltipTimeout);
            tooltipTimeout = setTimeout(() => {
                letterTooltip.classList.remove('show');
            }, 4000);
        }

        letterNotification.addEventListener('click', () => {
            if (isLetterOpened) {
                openLetterModal();
                return;
            }
            openEnvelope();
        });

        letterNotification.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (isLetterOpened) {
                    openLetterModal();
                } else {
                    openEnvelope();
                }
            }
        });

        function openEnvelope() {
            isLetterOpened = true;
            letterNotification.classList.add('opened');
            letterTooltip.classList.remove('show');
            if (tooltipTimeout) clearTimeout(tooltipTimeout);
            playEnvelopeSound();
            setTimeout(() => {
                openLetterModal();
            }, 700);
        }

        function openLetterModal() {
            letterTitle.textContent = LETTER_DATA.title;
            letterContent.textContent = LETTER_DATA.content;
            letterSignature.textContent = LETTER_DATA.signature;
            letterModal.classList.add('active');
            playPaperSound();
        }

        function closeLetterModal() {
            letterModal.classList.remove('active');
        }

        letterGiftBtn.addEventListener('click', () => {
            letterModal.classList.remove('active');
            setTimeout(() => {
                openGiftModal();
            }, 500);
        });

        letterModal.addEventListener('click', (e) => {
            if (e.target === letterModal) closeLetterModal();
        });

        /* ================================
           GIFT BOX
        ================================ */
        function openGiftModal() {
            giftModal.classList.add('active');
            giftBox.classList.remove('animating', 'paper-out');
            giftBoxContainer.style.pointerEvents = 'auto';
            playGiftSound();
        }

        function closeGiftModal() {
            giftModal.classList.remove('active');
        }

        giftBoxContainer.addEventListener('click', () => {
            if (isGiftOpened) return;
            isGiftOpened = true;
            giftBox.classList.add('animating');
            playGiftSound();
            setTimeout(() => {
                giftBox.classList.add('paper-out');
                playSparkleSound();
                createGiftParticles();
                setTimeout(() => {
                    showFinalScreen();
                }, 1000);
            }, 700);
        });

        giftBoxContainer.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter' || e.key === ' ') && !isGiftOpened) {
                e.preventDefault();
                giftBoxContainer.click();
            }
        });

        function createGiftParticles() {
            const container = giftBoxContainer;
            const colors = ['#f0d5d5', '#e8c8c8', '#f5e0e0', '#d4a860', '#faf0e8', '#c99898'];
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'gift-particle';
                const size = 4 + Math.random() * 8;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '40%';
                particle.style.setProperty('--px', (Math.random() - 0.5) * 200 + 'px');
                particle.style.setProperty('--py', (-60 - Math.random() * 150) + 'px');
                particle.style.animationDelay = (Math.random() * 0.3) + 's';
                particle.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
                container.appendChild(particle);
                setTimeout(() => {
                    if (particle.parentNode) particle.remove();
                }, 2000);
            }
        }

        giftModal.addEventListener('click', (e) => {
            if (e.target === giftModal && !isGiftOpened) {
                closeGiftModal();
            }
        });

        /* ================================
           FINAL SCREEN
        ================================ */
        function showFinalScreen() {
            giftModal.classList.remove('active');
            finalScreen.classList.add('active');
            playSparkleSound();
        }

        function closeFinalScreen() {
            finalScreen.classList.remove('active');
        }

        finalBtn.addEventListener('click', () => {
            finalScreen.classList.remove('active');
            isGiftOpened = false;
            giftBox.classList.remove('animating', 'paper-out');
            resetCamera();
        });

        /* ================================
           DUST PARTICLES
        ================================ */
        function createDustParticles() {
            for (let i = 0; i < 30; i++) {
                const dust = document.createElement('div');
                dust.className = 'world-dust-particle';
                dust.style.left = Math.random() * CAMERA_CONFIG.worldWidth + 'px';
                dust.style.top = Math.random() * CAMERA_CONFIG.worldHeight + 'px';
                dust.style.animationDelay = (Math.random() * 18) + 's';
                dust.style.animationDuration = (12 + Math.random() * 15) + 's';
                dust.style.width = (2 + Math.random() * 3) + 'px';
                dust.style.height = dust.style.width;
                dustContainer.appendChild(dust);
            }
        }

        /* ================================
           INITIALIZATION
        ================================ */
        function init() {
            createMemoryPhotos();
            createDustParticles();
            updatePasswordDots();
            calculateCameraBounds();
            worldContainer.style.transform = 'translate3d(0, 0, 0) scale(1)';
            memorySpace.classList.add('hidden');
            passwordScreen.classList.remove('hidden');
            // Set initial camera position to center of world
            const vp = getViewportSize();
            camera.x = camera.targetX = (vp.width - CAMERA_CONFIG.worldWidth) / 2;
            camera.y = camera.targetY = (vp.height - CAMERA_CONFIG.worldHeight) / 2;
            camera.zoom = camera.targetZoom = Math.max(CAMERA_CONFIG.minZoom,
                Math.min(CAMERA_CONFIG.maxZoom, Math.min(vp.width / CAMERA_CONFIG.worldWidth, vp.height / CAMERA_CONFIG
                    .worldHeight) * 1.2));
            applyCameraTransform(true);
        }

        window.addEventListener('resize', () => {
            calculateCameraBounds();
            if (!isUnlocked) {
                const vp = getViewportSize();
                camera.x = camera.targetX = (vp.width - CAMERA_CONFIG.worldWidth) / 2;
                camera.y = camera.targetY = (vp.height - CAMERA_CONFIG.worldHeight) / 2;
                camera.zoom = camera.targetZoom = Math.max(CAMERA_CONFIG.minZoom,
                    Math.min(CAMERA_CONFIG.maxZoom, Math.min(vp.width / CAMERA_CONFIG.worldWidth, vp.height / CAMERA_CONFIG
                        .worldHeight) * 1.2));
                applyCameraTransform(true);
            }
        });

        // Prevent default touch behaviors on the body
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('#memory-space') || e.target.closest('#password-screen')) {
                e.preventDefault();
            }
        }, { passive: false });

        // First interaction to unlock audio
        document.addEventListener('click', () => {
            initAudio();
            if (isUnlocked && !isMusicPlaying) {
                playBackgroundMusic();
            }
        }, { once: true });

        init();

        console.log('🎂 Birthday Memory Space loaded!');
        console.log('🔑 Password:', PASSWORD);
        console.log('📷 Memories:', MEMORIES.length, 'photos');
    </script>
</body>
