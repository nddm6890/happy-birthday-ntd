<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =========================
           RESET
        ========================= */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf6f1;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible {
            outline: 3px solid rgba(190, 120, 140, 0.6);
            outline-offset: 2px;
            border-radius: 12px;
        }

        /* =========================
           VARIABLES
        ========================= */
        :root {
            --cream: #faf6f1;
            --cream-dark: #f3ece4;
            --blush: #f8e8e8;
            --pastel-pink: #f5dcdc;
            --dusty-rose: #dba8a8;
            --soft-rose: #c98a8a;
            --brown-rose: #a87070;
            --burgundy: #8b4a4a;
            --gold-warm: #d4a860;
            --text-dark: #4a3535;
            --text-medium: #6b5050;
            --text-light: #9a7a7a;
            --white: #ffffff;
            --shadow-soft: 0 8px 30px rgba(160, 100, 100, 0.15);
            --shadow-medium: 0 15px 45px rgba(140, 80, 80, 0.2);
            --shadow-large: 0 25px 70px rgba(120, 60, 60, 0.25);
            --radius-small: 8px;
            --radius-medium: 16px;
            --radius-large: 24px;
            --radius-xl: 32px;
            --font-serif: 'Playfair Display', serif;
            --font-hand: 'Dancing Script', cursive;
            --font-body: 'Inter', sans-serif;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* =========================
           PASSWORD SCREEN
        ========================= */
        #password-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #faf6f1 0%, #f8e8e8 30%, #f0d8d8 60%, #f5e0e0 100%);
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                filter 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }
        #password-screen.hidden {
            opacity: 0;
            filter: blur(20px);
            transform: scale(1.05);
            pointer-events: none;
        }

        .password-bg-shapes {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .password-bg-shapes .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.25;
            animation: floatShape 12s ease-in-out infinite;
        }
        .password-bg-shapes .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #f0d0d0;
            top: -80px;
            left: -60px;
            animation-delay: 0s;
        }
        .password-bg-shapes .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #e8c8c8;
            bottom: 10%;
            right: -40px;
            animation-delay: -4s;
        }
        .password-bg-shapes .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: #f5dede;
            top: 20%;
            right: 15%;
            animation-delay: -8s;
        }
        .password-bg-shapes .shape:nth-child(4) {
            width: 180px;
            height: 180px;
            background: #ecd5d5;
            bottom: -30px;
            left: 20%;
            animation-delay: -2s;
        }

        @keyframes floatShape {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(15px, -20px) scale(1.05);
            }
            50% {
                transform: translate(-10px, 15px) scale(0.95);
            }
            75% {
                transform: translate(20px, 10px) scale(1.02);
            }
        }

        .password-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.55);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-large);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 420px;
            width: 90%;
        }

        .password-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .password-subtitle {
            font-family: var(--font-hand);
            font-size: 1.25rem;
            color: var(--text-medium);
            margin-bottom: 28px;
        }

        .password-dots {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 32px;
            min-height: 40px;
            align-items: center;
        }
        .password-dots .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: transparent;
            border: 2.5px solid var(--dusty-rose);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }
        .password-dots .dot.filled {
            background: var(--soft-rose);
            border-color: var(--soft-rose);
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(200, 130, 130, 0.5);
        }
        .password-dots.shake {
            animation: shakeDots 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }
        @keyframes shakeDots {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-12px);
            }
            30% {
                transform: translateX(10px);
            }
            45% {
                transform: translateX(-7px);
            }
            60% {
                transform: translateX(5px);
            }
            75% {
                transform: translateX(-3px);
            }
        }

        .password-error {
            font-size: 0.9rem;
            color: #c05050;
            min-height: 28px;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .password-error.show {
            opacity: 1;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-width: 300px;
            margin: 0 auto;
        }
        .keypad button {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid rgba(220, 180, 180, 0.4);
            box-shadow: 0 4px 15px rgba(160, 100, 100, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .keypad button:active {
            transform: scale(0.88);
            background: rgba(245, 220, 220, 0.9);
            box-shadow: 0 2px 8px rgba(160, 100, 100, 0.15);
        }
        .keypad button:hover {
            background: rgba(250, 235, 235, 0.9);
            border-color: rgba(200, 150, 150, 0.5);
            box-shadow: 0 6px 20px rgba(160, 100, 100, 0.18);
            transform: translateY(-2px);
        }
        .keypad button.keypad-backspace {
            font-size: 1.1rem;
            color: var(--text-medium);
        }
        .keypad button.keypad-enter {
            font-size: 1.3rem;
            background: rgba(210, 160, 160, 0.3);
            border-color: rgba(200, 140, 140, 0.4);
            color: var(--brown-rose);
        }
        .keypad button.keypad-enter:hover {
            background: rgba(210, 160, 160, 0.45);
        }
        .keypad button.success-flash {
            background: #c8e6c0 !important;
            border-color: #a0c898 !important;
            color: #4a7a4a !important;
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(140, 200, 140, 0.6);
        }

        /* =========================
           SOUND TOGGLE BUTTON
        ========================= */
        #sound-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(220, 180, 180, 0.4);
            box-shadow: var(--shadow-soft);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-dark);
        }
        #sound-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-medium);
        }
        #sound-toggle:active {
            transform: scale(0.9);
        }

        /* =========================
           MEMORY SPACE
        ========================= */
        #memory-space {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: var(--cream);
            overflow: hidden;
            cursor: grab;
            transition: opacity 0.5s ease;
        }
        #memory-space.dragging {
            cursor: grabbing;
        }
        #memory-space.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #world-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 4000px;
            height: 3000px;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
        }
        #world-container.photos-active {
            pointer-events: auto;
        }

        /* Background layers inside world */
        .world-bg-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .world-bg-base {
            background: linear-gradient(135deg, #faf6f1 0%, #f8eded 25%, #f5e0e0 50%, #f8ecec 75%, #faf3f0 100%);
        }
        .world-bg-shapes {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .world-bg-shapes .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
            pointer-events: none;
            animation: blobFloat 15s ease-in-out infinite;
        }
        .world-bg-shapes .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #f0d5d5;
            top: -100px;
            left: 200px;
            animation-delay: 0s;
        }
        .world-bg-shapes .blob:nth-child(2) {
            width: 350px;
            height: 350px;
            background: #e8c8c8;
            top: 500px;
            left: 1800px;
            animation-delay: -4s;
        }
        .world-bg-shapes .blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: #f5dede;
            top: 1200px;
            left: 400px;
            animation-delay: -8s;
        }
        .world-bg-shapes .blob:nth-child(4) {
            width: 450px;
            height: 450px;
            background: #ecd8d8;
            top: 2000px;
            left: 2500px;
            animation-delay: -2s;
        }
        .world-bg-shapes .blob:nth-child(5) {
            width: 300px;
            height: 300px;
            background: #f0d0d0;
            top: 800px;
            left: 3000px;
            animation-delay: -6s;
        }
        .world-bg-shapes .blob:nth-child(6) {
            width: 380px;
            height: 380px;
            background: #f8e5e5;
            top: 1800px;
            left: 600px;
            animation-delay: -10s;
        }
        .world-bg-shapes .blob:nth-child(7) {
            width: 250px;
            height: 250px;
            background: #e0c0c0;
            top: 2600px;
            left: 1500px;
            animation-delay: -12s;
        }
        .world-bg-shapes .blob:nth-child(8) {
            width: 320px;
            height: 320px;
            background: #f5d5d5;
            top: 400px;
            left: 3500px;
            animation-delay: -7s;
        }

        @keyframes blobFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            20% {
                transform: translate(30px, -40px) scale(1.08);
            }
            40% {
                transform: translate(-25px, 25px) scale(0.94);
            }
            60% {
                transform: translate(40px, 15px) scale(1.05);
            }
            80% {
                transform: translate(-15px, -30px) scale(0.97);
            }
        }

        /* Light spots */
        .world-light-spot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.15;
            filter: blur(40px);
            animation: lightPulse 8s ease-in-out infinite;
        }
        .world-light-spot:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #fff5e8;
            top: 200px;
            left: 800px;
            animation-delay: 0s;
        }
        .world-light-spot:nth-child(2) {
            width: 500px;
            height: 500px;
            background: #fce8e8;
            top: 1500px;
            left: 2000px;
            animation-delay: -3s;
        }
        .world-light-spot:nth-child(3) {
            width: 400px;
            height: 400px;
            background: #f5e0d8;
            top: 2400px;
            left: 800px;
            animation-delay: -6s;
        }
        .world-light-spot:nth-child(4) {
            width: 550px;
            height: 550px;
            background: #fff0e8;
            top: 800px;
            left: 3000px;
            animation-delay: -4s;
        }

        @keyframes lightPulse {
            0%,
            100% {
                opacity: 0.1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(1.15);
            }
        }

        /* Dust particles */
        .world-dust-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(180, 140, 140, 0.35);
            border-radius: 50%;
            pointer-events: none;
            animation: dustFloat 18s linear infinite;
            opacity: 0;
        }
        @keyframes dustFloat {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0);
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(-250px) translateX(40px);
            }
        }

        /* =========================
           PHOTOS / MEMORIES
        ========================= */
        .memory-photo {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                filter 0.35s ease;
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
        }
        .memory-photo-inner {
            background: var(--white);
            border-radius: 8px;
            padding: 14px 14px 20px;
            box-shadow: 0 6px 25px rgba(140, 80, 80, 0.18),
                0 2px 6px rgba(140, 80, 80, 0.1);
            text-align: center;
            position: relative;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(220, 190, 190, 0.3);
        }
        .memory-photo-inner::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 15%;
            right: 15%;
            height: 12px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            filter: blur(6px);
            transition: all 0.3s ease;
        }

        .memory-photo:hover .memory-photo-inner {
            transform: scale(1.06) rotate(0deg) !important;
            box-shadow: 0 20px 50px rgba(140, 80, 80, 0.28),
                0 4px 12px rgba(140, 80, 80, 0.15);
            border-color: rgba(200, 150, 150, 0.4);
        }
        .memory-photo:hover {
            z-index: 50 !important;
        }
        .memory-photo:hover .memory-photo-inner::after {
            bottom: -8px;
            height: 16px;
            filter: blur(8px);
            background: rgba(0, 0, 0, 0.12);
        }

        .memory-photo img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            pointer-events: none;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #e8ddd5;
            transition: transform 0.3s ease;
        }
        .memory-photo:hover img {
            transform: scale(1.02);
        }

        .memory-photo-caption {
            font-family: var(--font-hand);
            font-size: 1.1rem;
            color: var(--text-medium);
            margin-top: 10px;
            line-height: 1.3;
        }
        .memory-photo-date {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Photo lightbox */
        #photo-lightbox {
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: rgba(40, 20, 20, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
        }
        #photo-lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-content {
            background: var(--white);
            border-radius: var(--radius-large);
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: var(--shadow-large);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #photo-lightbox.active .lightbox-content {
            transform: scale(1) translateY(0);
        }
        .lightbox-content img {
            width: 100%;
            max-height: 50vh;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
            color: var(--text-dark);
            z-index: 1501;
        }
        .lightbox-close:hover {
            transform: scale(1.1);
            background: var(--white);
        }
        .lightbox-title {
            font-family: var(--font-hand);
            font-size: 1.6rem;
            color: var(--text-dark);
            margin-top: 16px;
        }
        .lightbox-desc {
            font-size: 0.95rem;
            color: var(--text-medium);
            margin-top: 8px;
            line-height: 1.6;
        }
        .lightbox-date {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* =========================
           LETTER NOTIFICATION (Fixed UI)
        ========================= */
        #letter-notification {
            position: fixed;
            right: 28px;
            top: 28px;
            z-index: 900;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #letter-notification:hover {
            transform: scale(1.08);
        }
        #letter-notification:active {
            transform: scale(0.92);
        }
        #letter-notification.opened .letter-badge {
            display: none;
        }
        #letter-notification.opened .letter-envelope-icon {
            animation: none !important;
        }

        .letter-envelope-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(160deg, #fdf5f0 0%, #f8e5e5 40%, #f0d5d5 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 30px rgba(160, 100, 100, 0.25),
                0 2px 8px rgba(160, 100, 100, 0.12);
            border: 1.5px solid rgba(220, 180, 180, 0.5);
            animation: letterIdle 2.5s ease-in-out infinite;
            position: relative;
            transition: all 0.3s ease;
        }
        @keyframes letterIdle {
            0%,
            100% {
                transform: rotate(0deg) translateY(0);
            }
            15% {
                transform: rotate(-4deg) translateY(-3px);
            }
            30% {
                transform: rotate(4deg) translateY(-2px);
            }
            45% {
                transform: rotate(-3deg) translateY(-1px);
            }
            60% {
                transform: rotate(0deg) translateY(0);
            }
        }
        #letter-notification.opened .letter-envelope-icon {
            animation: none;
            box-shadow: 0 4px 15px rgba(160, 100, 100, 0.15);
            opacity: 0.7;
        }

        .letter-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e05050;
            color: var(--white);
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(200, 60, 60, 0.5);
            animation: badgePulse 1.8s ease-in-out infinite;
            border: 2px solid var(--white);
        }
        @keyframes badgePulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 3px 10px rgba(200, 60, 60, 0.5);
            }
            50% {
                transform: scale(1.2);
                box-shadow: 0 3px 18px rgba(200, 60, 60, 0.75);
            }
        }

        .letter-tooltip {
            position: absolute;
            right: 0;
            top: 74px;
            background: var(--white);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-dark);
            box-shadow: var(--shadow-medium);
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            font-weight: 500;
            border: 1px solid rgba(220, 190, 190, 0.3);
        }
        .letter-tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }
        .letter-tooltip::after {
            content: '';
            position: absolute;
            top: -6px;
            right: 24px;
            width: 10px;
            height: 10px;
            background: var(--white);
            transform: rotate(45deg);
            border-top: 1px solid rgba(220, 190, 190, 0.3);
            border-left: 1px solid rgba(220, 190, 190, 0.3);
        }

        /* =========================
           LETTER MODAL
        ========================= */
        #letter-modal {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(40, 20, 20, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
        }
        #letter-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        #letter-modal .letter-paper {
            background: var(--cream);
            border-radius: var(--radius-large);
            padding: 40px 35px;
            max-width: 520px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-large);
            transform: scale(0.8) translateY(30px);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            border: 1px solid rgba(220, 190, 190, 0.2);
            position: relative;
            background-image: linear-gradient(rgba(200, 170, 170, 0.04) 1px, transparent 1px);
            background-size: 100% 28px;
        }
        #letter-modal.active .letter-paper {
            transform: scale(1) translateY(0);
        }
        .letter-paper-title {
            font-family: var(--font-hand);
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.3;
        }
        .letter-paper-content {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-medium);
            line-height: 1.9;
            white-space: pre-line;
            text-align: left;
            margin-bottom: 24px;
            font-weight: 400;
        }
        .letter-paper-signature {
            font-family: var(--font-hand);
            font-size: 1.4rem;
            color: var(--soft-rose);
            margin-bottom: 20px;
        }
        .letter-gift-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(160deg, #f0d5d5 0%, #e0b8b8 100%);
            color: var(--text-dark);
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(180, 120, 120, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 1px solid rgba(200, 150, 150, 0.4);
            letter-spacing: 0.5px;
            font-family: var(--font-body);
        }
        .letter-gift-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 30px rgba(180, 120, 120, 0.35);
            background: linear-gradient(160deg, #f5dede 0%, #e8c5c5 100%);
        }
        .letter-gift-btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(180, 120, 120, 0.2);
        }

        /* =========================
           GIFT BOX MODAL
        ========================= */
        #gift-modal {
            position: fixed;
            inset: 0;
            z-index: 1300;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 15, 15, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
        }
        #gift-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .gift-box-container {
            position: relative;
            text-align: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.3s ease;
        }
        .gift-box-container:hover {
            transform: scale(1.04);
        }
        .gift-box-container:active {
            transform: scale(0.95);
        }

        .gift-box {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .gift-box-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 110px;
            background: linear-gradient(180deg, #f0d0d0 0%, #e0b5b5 40%, #d5a0a0 100%);
            border-radius: 8px 8px 12px 12px;
            box-shadow: 0 8px 30px rgba(120, 60, 60, 0.3);
            border: 2px solid rgba(190, 140, 140, 0.4);
            overflow: hidden;
        }
        .gift-box-body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 28px;
            background: linear-gradient(180deg, #faf0e8 0%, #f0e0d8 50%, #faf0e8 100%);
            transform: translateY(-50%);
            border-top: 2px solid rgba(200, 150, 150, 0.3);
            border-bottom: 2px solid rgba(200, 150, 150, 0.3);
            z-index: 2;
        }
        .gift-box-lid {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 45px;
            background: linear-gradient(180deg, #f5d8d8 0%, #e8bcbc 100%);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(120, 60, 60, 0.25);
            border: 2px solid rgba(190, 140, 140, 0.4);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 3;
        }
        .gift-box-lid::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 28px;
            background: linear-gradient(180deg, #fae8dc 0%, #f5d5d0 100%);
            border-radius: 50%;
            border: 2px solid rgba(200, 150, 150, 0.4);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .gift-box-ribbon-v {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 100%;
            background: linear-gradient(180deg, #d4a860 0%, #c99550 50%, #d4a860 100%);
            border-radius: 2px;
            z-index: 4;
            pointer-events: none;
            opacity: 0.85;
        }
        .gift-box.animating .gift-box-body {
            animation: giftShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }
        .gift-box.animating .gift-box-lid {
            animation: lidPopOff 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes giftShake {
            0%,
            100% {
                transform: translateX(-50%) rotate(0deg);
            }
            15% {
                transform: translateX(-52%) rotate(-2deg);
            }
            30% {
                transform: translateX(-48%) rotate(2deg);
            }
            45% {
                transform: translateX(-51%) rotate(-1.5deg);
            }
            60% {
                transform: translateX(-49%) rotate(1deg);
            }
            75% {
                transform: translateX(-50%) rotate(-0.5deg);
            }
        }
        @keyframes lidPopOff {
            0% {
                transform: translateX(-50%) rotate(0deg) translateY(0);
                opacity: 1;
            }
            40% {
                transform: translateX(-50%) rotate(-10deg) translateY(-10px);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) rotate(-25deg) translateY(-120px);
                opacity: 0;
            }
        }
        .gift-box.paper-out .gift-box-body {
            animation: boxGlow 0.8s ease forwards;
        }
        @keyframes boxGlow {
            0% {
                box-shadow: 0 8px 30px rgba(120, 60, 60, 0.3);
            }
            50% {
                box-shadow: 0 8px 50px rgba(220, 180, 100, 0.6), 0 0 60px rgba(255, 220, 150, 0.3);
            }
            100% {
                box-shadow: 0 8px 30px rgba(120, 60, 60, 0.3), 0 0 40px rgba(255, 220, 150, 0.2);
            }
        }

        /* Gift particles */
        .gift-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0;
            z-index: 5;
        }
        @keyframes particleFly {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0);
            }
            20% {
                opacity: 1;
                transform: translate(0, -10px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--px, 30px), var(--py, -120px)) scale(0.3);
            }
        }

        /* =========================
           FINAL MESSAGE SCREEN
        ========================= */
        #final-screen {
            position: fixed;
            inset: 0;
            z-index: 1400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #faf6f1 0%, #f8e8e8 35%, #f0d8d8 70%, #f5e0e0 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            padding: 30px;
            text-align: center;
        }
        #final-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .final-heart {
            font-size: 3.5rem;
            animation: heartbeat 1.2s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.2);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
            }
            60% {
                transform: scale(1);
            }
        }
        .final-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 2px;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        .final-message {
            font-family: var(--font-hand);
            font-size: 1.4rem;
            color: var(--text-medium);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .final-btn {
            padding: 16px 36px;
            background: linear-gradient(160deg, #f0d5d5 0%, #e0b8b8 100%);
            color: var(--text-dark);
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(180, 120, 120, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 1px solid rgba(200, 150, 150, 0.4);
            letter-spacing: 0.5px;
        }
        .final-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 30px rgba(180, 120, 120, 0.35);
        }
        .final-btn:active {
            transform: scale(0.95);
        }

        /* =========================
           RESET CAMERA BUTTON
        ========================= */
        #reset-camera {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 800;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(220, 180, 180, 0.4);
            box-shadow: var(--shadow-soft);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-dark);
        }
        #reset-camera:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-medium);
        }
        #reset-camera:active {
            transform: scale(0.9);
        }

        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 768px) {
            .password-container {
                padding: 28px 20px;
                max-width: 340px;
                width: 92%;
            }
            .password-title {
                font-size: 1.3rem;
            }
            .password-subtitle {
                font-size: 1.05rem;
                margin-bottom: 20px;
            }
            .keypad {
                gap: 10px;
                max-width: 260px;
            }
            .keypad button {
                width: 60px;
                height: 60px;
                font-size: 1.2rem;
            }
            .password-dots {
                gap: 14px;
                margin-bottom: 24px;
            }
            .password-dots .dot {
                width: 13px;
                height: 13px;
                border-width: 2px;
            }
            #sound-toggle {
                top: 12px;
                left: 12px;
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            #letter-notification {
                right: 16px;
                top: 14px;
            }
            .letter-envelope-icon {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
                border-radius: 12px;
            }
            .letter-badge {
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
                top: -4px;
                right: -4px;
            }
            .letter-tooltip {
                font-size: 0.75rem;
                padding: 8px 12px;
                top: 58px;
            }
            #reset-camera {
                bottom: 16px;
                right: 16px;
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .letter-paper {
                padding: 28px 22px;
            }
            .letter-paper-title {
                font-size: 1.6rem;
            }
            .gift-box {
                width: 140px;
                height: 140px;
            }
            .gift-box-body {
                width: 110px;
                height: 85px;
            }
            .gift-box-lid {
                width: 126px;
                height: 38px;
                top: 14px;
            }
            .final-title {
                font-size: 2rem;
            }
            .final-message {
                font-size: 1.1rem;
            }
            .lightbox-content {
                padding: 20px;
            }
        }
        @media (max-width: 380px) {
            .keypad button {
                width: 52px;
                height: 52px;
                font-size: 1.05rem;
            }
            .keypad {
                gap: 8px;
                max-width: 220px;
            }
            .password-container {
                padding: 20px 14px;
            }
            .letter-envelope-icon {
                width: 44px;
                height: 44px;
                font-size: 1.3rem;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }
            .password-bg-shapes .shape,
            .world-bg-shapes .blob,
            .world-light-spot,
            .world-dust-particle,
            .letter-envelope-icon,
            .letter-badge,
            .final-heart,
            .gift-box.animating .gift-box-body,
            .gift-box.animating .gift-box-lid {
                animation: none !important;
            }
            .memory-photo {
                transition: transform 0.15s ease, box-shadow 0.15s ease;
            }
            .memory-photo:hover .memory-photo-inner {
                transform: scale(1.03) !important;
            }
        }
    </style>
</head>
<body>

    <!-- =========================
         PASSWORD SCREEN
    ========================= -->
    <div id="password-screen" aria-label="Màn hình nhập mật khẩu">
        <div class="password-bg-shapes" aria-hidden="true">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        <div class="password-container">
            <h1 class="password-title">✨ Một chút bí mật trước khi bắt đầu… ✨</h1>
            <p class="password-subtitle">Nhập mật mã 4 số để mở khóa kỷ niệm</p>
            <div class="password-dots" id="password-dots" aria-label="Mật khẩu 4 chữ số">
                <span class="dot" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
                <span class="dot" data-index="3"></span>
            </div>
            <p class="password-error" id="password-error" aria-live="polite">Sai rồi... thử lại nhé ❤️</p>
            <div class="keypad" id="keypad" role="grid" aria-label="Bàn phím số">
                <button data-key="1" role="gridcell" aria-label="1">1</button>
                <button data-key="2" role="gridcell" aria-label="2">2</button>
                <button data-key="3" role="gridcell" aria-label="3">3</button>
                <button data-key="4" role="gridcell" aria-label="4">4</button>
                <button data-key="5" role="gridcell" aria-label="5">5</button>
                <button data-key="6" role="gridcell" aria-label="6">6</button>
                <button data-key="7" role="gridcell" aria-label="7">7</button>
                <button data-key="8" role="gridcell" aria-label="8">8</button>
                <button data-key="9" role="gridcell" aria-label="9">9</button>
                <button data-key="backspace" class="keypad-backspace" role="gridcell" aria-label="Xóa">←</button>
                <button data-key="0" role="gridcell" aria-label="0">0</button>
                <button data-key="enter" class="keypad-enter" role="gridcell" aria-label="Xác nhận">✓</button>
            </div>
        </div>
    </div>

    <!-- =========================
         SOUND TOGGLE
    ========================= -->
    <button id="sound-toggle" aria-label="Bật/tắt âm thanh" title="Âm thanh">🔊</button>

    <!-- =========================
         MEMORY SPACE
    ========================= -->
    <div id="memory-space" aria-label="Không gian kỷ niệm">
        <div id="world-container">
            <!-- Base layer -->
            <div class="world-bg-layer world-bg-base"></div>
            <!-- Decorative shapes -->
            <div class="world-bg-shapes" aria-hidden="true">
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
            </div>
            <!-- Light spots -->
            <div class="world-light-spot" aria-hidden="true"></div>
            <div class="world-light-spot" aria-hidden="true"></div>
            <div class="world-light-spot" aria-hidden="true"></div>
            <div class="world-light-spot" aria-hidden="true"></div>
            <!-- Photos will be dynamically inserted here -->
            <div id="photos-container"></div>
            <!-- Dust particles will be dynamically inserted here -->
            <div id="dust-container"></div>
        </div>
    </div>

    <!-- =========================
         LETTER NOTIFICATION
    ========================= -->
    <div id="letter-notification" aria-label="Bạn có một lá thư" title="Bạn có một lá thư 💌" role="button" tabindex="0">
        <div class="letter-envelope-icon">💌</div>
        <div class="letter-badge">1</div>
        <div class="letter-tooltip" id="letter-tooltip">Bạn có một lá thư 💌</div>
    </div>

    <!-- =========================
         RESET CAMERA
    ========================= -->
    <button id="reset-camera" aria-label="Đặt lại vị trí camera" title="Reset camera">⟳</button>

    <!-- =========================
         PHOTO LIGHTBOX
    ========================= -->
    <div id="photo-lightbox" aria-label="Xem ảnh kỷ niệm">
        <button class="lightbox-close" id="lightbox-close" aria-label="Đóng">✕</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Kỷ niệm">
            <h3 class="lightbox-title" id="lightbox-title"></h3>
            <p class="lightbox-desc" id="lightbox-desc"></p>
            <p class="lightbox-date" id="lightbox-date"></p>
        </div>
    </div>

    <!-- =========================
         LETTER MODAL
    ========================= -->
    <div id="letter-modal" aria-label="Lá thư">
        <div class="letter-paper">
            <h2 class="letter-paper-title" id="letter-title"></h2>
            <div class="letter-paper-content" id="letter-content"></div>
            <p class="letter-paper-signature" id="letter-signature"></p>
            <button class="letter-gift-btn" id="letter-gift-btn">🎁 MỞ QUÀ</button>
        </div>
    </div>

    <!-- =========================
         GIFT MODAL
    ========================= -->
    <div id="gift-modal" aria-label="Hộp quà">
        <div class="gift-box-container" id="gift-box-container" role="button" tabindex="0" aria-label="Mở hộp quà">
            <div class="gift-box" id="gift-box">
                <div class="gift-box-ribbon-v"></div>
                <div class="gift-box-body"></div>
                <div class="gift-box-lid"></div>
            </div>
            <p style="font-family: var(--font-hand); color: var(--cream); font-size: 1.1rem; margin-top: 16px; opacity: 0.9;">Nhấn để mở quà ✨</p>
        </div>
    </div>

    <!-- =========================
         FINAL SCREEN
    ========================= -->
    <div id="final-screen" aria-label="Lời nhắn cuối cùng">
        <div class="final-heart">❤️</div>
        <h1 class="final-title">HAPPY BIRTHDAY</h1>
        <p class="final-message">Cảm ơn vì đã xuất hiện<br>trong những kỷ niệm đẹp này.</p>
        <button class="final-btn" id="final-btn">Xem lại kỷ niệm</button>
    </div>

    <script>
        /* ================================

        function initAudio() {
            if (audioCtx) return;

            } catch (e) {
                console.warn('Web Audio API not supported');
            }
        }

        function playClickSound() {
            if (!audioCtx || isMusicMuted) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.09);
            } catch (e) { /* silent */ }
        }

        function playEnvelopeSound() {
            if (!audioCtx || isMusicMuted) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) { /* silent */ }
        }

        function playPaperSound() {
            if (!audioCtx || isMusicMuted) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.06 * (1 - i / bufferSize);
                }
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start(audioCtx.currentTime);
            } catch (e) { /* silent */ }
        }

        function startAmbientMusic() {
            if (!audioCtx) initAudio();
            if (!audioCtx || ambientMusicNodes) return;
            try {
                const masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);

                const chordProgressions = [
                    [261.63, 329.63, 392.00], // C major
                    [293.66, 349.23, 440.00], // D minor
                    [220.00, 277.18, 329.63], // A minor
                    [246.94, 293.66, 369.99] // B diminished (or G major)
                ];
                let chordIndex = 0;

                function playChord() {
                    if (isMusicMuted || !audioCtx) {
                        ambientMusicNodes = null;
                        return;
                    }
                    const chord = chordProgressions[chordIndex % chordProgressions.length];
                    chordIndex++;
                    chord.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(1200 + i * 200, audioCtx.currentTime);
                        osc.type = i === 0 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        osc.frequency.detune.setValueAtTime(i * 3, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.08 + (1 - i) * 0.03, audioCtx.currentTime + 0.5);
                        gain.gain.linearRampToValueAtTime(0.005, audioCtx.currentTime + 3.8);
                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(masterGain);
                        osc.start(audioCtx.currentTime);
                        osc.stop(audioCtx.currentTime + 4);
                    });
                    if (chordIndex >= 8) chordIndex = 0;
                    ambientMusicTimer = setTimeout(playChord, 3500);
                }

                playChord();
                ambientMusicNodes = masterGain;
                isMusicPlaying = true;
            } catch (e) {
                console.warn('Cannot play ambient music', e);
                ambientMusicNodes = null;
            }
        }

        function stopAmbientMusic() {
            if (ambientMusicTimer) {
                clearTimeout(ambientMusicTimer);
                ambientMusicTimer = null;
            }
            if (ambientMusicNodes) {
                try {
                    ambientMusicNodes.disconnect();
                } catch (e) { /* silent */ }
                ambientMusicNodes = null;
            }
            isMusicPlaying = false;
        }

        /* ================================
           CAMERA SYSTEM
        ================================ */
        function getViewportSize() {
            return {
                width: window.innerWidth,
                height: window.innerHeight
            };
        }

        function calculateCameraBounds() {
            const vp = getViewportSize();
            const w = CAMERA_CONFIG.worldWidth * camera.zoom;
            const h = CAMERA_CONFIG.worldHeight * camera.zoom;
            if (w <= vp.width) {
                const centerX = (vp.width - w) / 2;
                camera.minX = centerX;
                camera.maxX = centerX;
            } else {
                camera.minX = vp.width - w;
                camera.maxX = 0;
            }
            if (h <= vp.height) {
                const centerY = (vp.height - h) / 2;
                camera.minY = centerY;
                camera.maxY = centerY;
            } else {
                camera.minY = vp.height - h;
                camera.maxY = 0;
            }
        }

        function initCameraPosition() {
            const vp = getViewportSize();
            const w = CAMERA_CONFIG.worldWidth;
            const h = CAMERA_CONFIG.worldHeight;
            camera.x = camera.targetX = (vp.width - w) / 2;
            camera.y = camera.targetY = (vp.height - h) / 2;
            camera.zoom = camera.targetZoom = Math.max(CAMERA_CONFIG.minZoom,
                Math.min(CAMERA_CONFIG.maxZoom, Math.min(vp.width / w, vp.height / h) * 1.2));
            calculateCameraBounds();
            applyCameraTransform(true);
        }

        function applyCameraTransform(immediate) {
            if (immediate) {
                worldContainer.style.transform = `translate3d(${camera.x}px, ${camera.y}px, 0) scale(${camera.zoom})`;
            } else {
                worldContainer.style.transform = `translate3d(${camera.targetX}px, ${camera.targetY}px, 0) scale(${camera.targetZoom})`;
            }
        }

        function clampCamera() {
            calculateCameraBounds();
            const resistance = CAMERA_CONFIG.panResistance;
            if (camera.targetX > camera.maxX) {
                camera.targetX = camera.maxX + (camera.targetX - camera.maxX) * resistance;
            } else if (camera.targetX < camera.minX) {
                camera.targetX = camera.minX - (camera.minX - camera.targetX) * resistance;
            }
            if (camera.targetY > camera.maxY) {
                camera.targetY = camera.maxY + (camera.targetY - camera.maxY) * resistance;
            } else if (camera.targetY < camera.minY) {
                camera.targetY = camera.minY - (camera.minY - camera.targetY) * resistance;
            }
        }

        function startCameraLoop() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function loop() {
                const lerpFactor = 0.15;
                camera.x += (camera.targetX - camera.x) * lerpFactor;
                camera.y += (camera.targetY - camera.y) * lerpFactor;
                camera.zoom += (camera.targetZoom - camera.zoom) * lerpFactor;

                if (Math.abs(camera.targetX - camera.x) < 0.05 &&
                    Math.abs(camera.targetY - camera.y) < 0.05 &&
                    Math.abs(camera.targetZoom - camera.zoom) < 0.001) {
                    camera.x = camera.targetX;
                    camera.y = camera.targetY;
                    camera.zoom = camera.targetZoom;
                }

                worldContainer.style.transform =
                    `translate3d(${camera.x}px, ${camera.y}px, 0) scale(${camera.zoom})`;

                animationFrameId = requestAnimationFrame(loop);
            }
            animationFrameId = requestAnimationFrame(loop);
        }

        function resetCamera() {
            const vp = getViewportSize();
            const w = CAMERA_CONFIG.worldWidth;
            const h = CAMERA_CONFIG.worldHeight;
            camera.targetX = (vp.width - w) / 2;
            camera.targetY = (vp.height - h) / 2;
            camera.targetZoom = Math.max(CAMERA_CONFIG.minZoom,
                Math.min(CAMERA_CONFIG.maxZoom, Math.min(vp.width / w, vp.height / h) * 1.2));
            calculateCameraBounds();
        }

        resetCameraBtn.addEventListener('click', resetCamera);

        /* ================================
