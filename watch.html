<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Tràn kín toàn bộ màn hình */
        }
    </style>
</head>
<body>

    <!-- 
      - autoplay: Tự động phát 
      - muted: Tắt tiếng (BẮT BUỘC phải có thì trình duyệt mới cho autoplay)
      - playsinline: Cho phép chạy ngay trên trình duyệt di động (iOS/Android)
      - loop: Tự động lặp lại khi hết
    -->
    <video autoplay muted playsinline loop controls>
        <source src="my-video.mp4" type="video/mp4">
    </video>

</body>
</html>
